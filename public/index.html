<style>

</style></head><body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Manager Review Desk</h1>
      <p class="sub">Security and legal items that need your answer. Read the short version, open the context if you want examples, then submit one response at a time.</p>
    </div>
    <div class="tally" id="tally" aria-label="Progress"></div>
  </header>
  <div class="autobar" id="auto" role="group" aria-label="Auto-review"></div>
  <div class="desk">
    <nav class="queue" aria-label="Review queue">

// ---- small, safe Markdown preview (builds DOM nodes only; never inserts HTML) ----
function resolveDoc(base,href){

  var parts=(h.charAt(0)==="/"?h.slice(1):base.replace(/[^\/]*$/,"")+h).split("/"),out=[];
  parts.forEach(function(s){if(s===".."){out.pop()}else if(s&&s!==".")out.push(s)});
  return out.join("/");
}
function mdInline(s,base){
  var out=[],re=/(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\([^)\s]+\))|(\*[^*\s][^*]*\*)/g,pos=0,m;

  while((m=re.exec(s))){
    plain(s.slice(pos,m.index));pos=m.index+m[0].length;
    if(m[1])out.push(el("code",{text:m[1].slice(1,-1)}));
    else if(m[2])out.push(el("strong",null,mdInline(m[2].slice(2,-2),base)));
    else if(m[4])out.push(el("em",null,mdInline(m[4].slice(1,-1),base)));
    else if(m[3]){
      var lm=m[3].match(/^\[([^\]]+)\]\(([^)\s]+)\)$/),label=lm[1],href=lm[2];
      if(/^https?:\/\//i.test(href))out.push(el("a",{href:href,target:"_blank",rel:"noopener noreferrer",text:label}));
      else{var rp=resolveDoc(base,href);if(rp)out.push(el("button",{class:"ref",type:"button",title:"Open "+rp,onclick:function(){openDoc(rp,0)}},[label]));else out.push(label)}
    }
  }
  plain(s.slice(pos));return out;
}
function mdRender(lines,base){
  var root=el("div",{class:"md"}),starts=[],i=0,n=lines.length;
  function add(node,start){node.setAttribute("data-line",String(start));root.appendChild(node);starts.push({start:start,node:node})}
  var isBlank=function(t){return /^\s*$/.test(t)};
  var isSep=function(t){return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(t)&&t.indexOf("-")>-1};

  var startsBlock=function(t,nx){return /^(#{1,6})\s/.test(t)||/^```/.test(t)||/^\s*([-*]|\d+\.)\s+/.test(t)||/^>/.test(t)||/^(-{3,}|\*{3,})\s*$/.test(t)||(/^\s*\|/.test(t)&&nx!=null&&isSep(nx))};

    if(/^```/.test(t)){var code=[];i++;while(i<n&&!/^```/.test(lines[i])){code.push(lines[i]);i++}i++;add(el("pre",null,[el("code",{text:code.join("\n")})]),s0);continue}
    if(/^(-{3,}|\*{3,})\s*$/.test(t)){add(el("hr"),s0);i++;continue}
    if(/^\s*\|/.test(t)&&i+1<n&&isSep(lines[i+1])){
      var head=cellsOf(t);i+=2;var rows=[];while(i<n&&/^\s*\|/.test(lines[i])){rows.push(cellsOf(lines[i]));i++}
      var tb=el("table",null,[el("thead",null,[el("tr",null,head.map(function(c){return el("th",null,mdInline(c,base))}))]),el("tbody",null,rows.map(function(r){return el("tr",null,r.map(function(c){return el("td",null,mdInline(c,base))}))}))]);
      add(el("div",{class:"tblwrap"},[tb]),s0);continue}
    if(/^>/.test(t)){var q=[];while(i<n&&/^>/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,""));i++}add(el("blockquote",null,[el("p",null,mdInline(q.join(" "),base))]),s0);continue}
    if(/^\s*([-*]|\d+\.)\s+/.test(t)){

      while(i<n&&/^\s*([-*]|\d+\.)\s+/.test(lines[i])){var mm=lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);var li=el("li",{style:"margin-left:"+Math.floor(mm[1].length/2)*18+"px"},mdInline(mm[3],base));i++;
        while(i<n&&!isBlank(lines[i])&&!startsBlock(lines[i],lines[i+1])&&/^\s{2,}\S/.test(lines[i])){mdInline(lines[i].trim(),base).forEach(function(x){li.appendChild(typeof x==="string"?document.createTextNode(" "+x):x)});i++}
        items.push(li)}
      add(el(ord?"ol":"ul",{class:"mdl"},items),s0);continue}
    var para=[t.trim()];i++;
